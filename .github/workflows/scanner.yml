name: Stock Scanners

on:
  schedule:
    # Weekly scanner: every Friday 12pm PST (8pm UTC)
    - cron: '0 20 * * 5'
    # Daily scanner: Mon-Fri, 30min after market close (9pm UTC / 1pm PST)
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

jobs:

  # ── Weekly scan (Fridays only) ──────────────────────────────────────────────
  weekly-scan:
    runs-on: ubuntu-latest
    name: Weekly Scan (VixFix + Stoch + MACD + BB)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 20 * * 5'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy requests
      - name: Run weekly scan
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: python scanner_combined.py

  # ── Daily scan (Mon-Fri) ────────────────────────────────────────────────────
  daily-scan:
    runs-on: ubuntu-latest
    name: Daily Scan (VixFix + Stoch + MACD + BB)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 21 * * 1-5'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy requests
      - name: Run daily scan
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: python scanner_daily.py

  # ── Weekly backtest (manual dispatch only) ──────────────────────────────────
  backtest-weekly:
    runs-on: ubuntu-latest
    name: Backtest - Weekly bars
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy requests
      - name: Run weekly backtest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: python backtest.py

  # ── Daily backtest (manual dispatch only) ───────────────────────────────────
  backtest-daily:
    runs-on: ubuntu-latest
    name: Backtest - Daily bars
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy requests
      - name: Run daily backtest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: python backtest_daily.py

  # ── Exit target optimization (manual dispatch only) ─────────────────────────
  optimize-exits:
    runs-on: ubuntu-latest
    name: Optimize Exit Targets
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy requests
      - name: Run exit optimization
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: python backtest_optimize.py

  # ── Debug single ticker (manual dispatch only) ──────────────────────────────
  debug:
    runs-on: ubuntu-latest
    name: Debug Single Ticker
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy requests
      - name: Run debug
        run: python debug_ticker.py
