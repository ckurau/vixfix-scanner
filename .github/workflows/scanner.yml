# ══════════════════════════════════════════════════════════════════════════════
# SCHEDULED SCANS WORKFLOW
# Runs daily/weekly scans on schedule. Also triggered manually for scan-only.
# Reads backtest_stats.json from the repo (written by backtests.yml).
#
# TIMING (ET / US Eastern):
#   Daily scan:  Mon–Fri 6:30pm ET (23:30 UTC) — buy next morning at open
#   Weekly scan: Friday 6:30pm ET only          — buy Monday at open
# ══════════════════════════════════════════════════════════════════════════════

name: Stock Scanners

on:
  schedule:
    - cron: '30 23 * * 1-5'
  workflow_dispatch:

jobs:

  weekly-scan:
    runs-on: ubuntu-latest
    name: Weekly Scan (1wk — buy Monday open)
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy requests
      - name: Run weekly scan (Fridays only)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scanner_combined.py
          elif [ "$(date -u +%u)" = "5" ]; then
            python scanner_combined.py
          else
            echo "Not Friday — weekly scan skipped."
          fi
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}

  daily-scan:
    runs-on: ubuntu-latest
    name: Daily Scan (1d — buy next morning open)
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy requests
      - name: Run daily scan
        run: python scanner_daily.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
