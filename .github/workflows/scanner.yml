name: Weekly Stock Scanners

on:
  schedule:
    # 12pm PST = 8pm UTC every Friday
    - cron: '0 20 * * 5'
  workflow_dispatch:

jobs:
  combined-scan:
    runs-on: ubuntu-latest
    name: VixFix + Stochastic Combined Scan
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy requests
      - name: Run combined scan
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: python scanner_combined.py

  backtest:
    runs-on: ubuntu-latest
    name: Backtest Both Scans
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy requests
      - name: Run backtest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: python backtest.py

  optimize-exits:
    runs-on: ubuntu-latest
    name: Optimize Exit Target
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy requests
      - name: Run exit optimization
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: python backtest_optimize.py

  debug:
    runs-on: ubuntu-latest
    name: Debug Single Ticker
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy requests
      - name: Run debug
        run: python debug_ticker.py
