# ══════════════════════════════════════════════════════════════════════════════
# SCHEDULED SCANS WORKFLOW
#
# TIMING (PST = UTC-8, PDT = UTC-4):
#   Target: 6:30pm PST / 7:30pm PDT Mon–Fri
#   Cron:   02:30 UTC Tue–Sat  (= 6:30pm PST Mon–Fri)
#   Note:   During PDT (Mar–Nov) this fires at 7:30pm local — acceptable.
#           During PST (Nov–Mar) this fires at 6:30pm local — exact.
#
# BEHAVIOR:
#   Scheduled runs:         add signals to trade_history.json, attach tracker,
#                           commit trade_history.json to repo
#   workflow_dispatch runs: send email + tracker with current state,
#                           do NOT add new signals or commit
#
# DAILY SCAN:  Mon–Fri — buy next morning at open
# WEEKLY SCAN: Friday only (filtered inside job step) — buy Monday at open
# ══════════════════════════════════════════════════════════════════════════════

name: Stock Scanners

on:
  schedule:
    - cron: '30 2 * * 2-6'
  workflow_dispatch:

jobs:

  weekly-scan:
    runs-on: ubuntu-latest
    name: Weekly Scan (1wk — buy Monday open)
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy requests openpyxl
      - name: Run weekly scan (Fridays only)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scanner_combined.py
          elif [ "$(date -u +%u)" = "5" ]; then
            python scanner_combined.py
          else
            echo "Not Friday — weekly scan skipped."
          fi
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
      - name: Commit trade_history.json (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trade_history.json
          git diff --cached --quiet && echo "No new signals to commit" && exit 0
          git stash
          git pull --rebase origin main
          git stash pop
          git add trade_history.json
          git commit -m "Add weekly scan signals to trade history [skip ci]"
          for i in 1 2 3; do
            git push && break
            echo "Push attempt $i failed, retrying..."
            git pull --rebase origin main
          done

  daily-scan:
    runs-on: ubuntu-latest
    name: Daily Scan (1d — buy next morning open)
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy requests openpyxl
      - name: Run daily scan
        run: python scanner_daily.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
      - name: Commit trade_history.json (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trade_history.json
          git diff --cached --quiet && echo "No new signals to commit" && exit 0
          git stash
          git pull --rebase origin main
          git stash pop
          git add trade_history.json
          git commit -m "Add daily scan signals to trade history [skip ci]"
          for i in 1 2 3; do
            git push && break
            echo "Push attempt $i failed, retrying..."
            git pull --rebase origin main
          done
